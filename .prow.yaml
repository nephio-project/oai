presubmits:
  - name: oai-operator-unit-test
    decorate: true
    run_if_changed: "^.*.go$"
    spec:
      containers:
      - image: golang:1.25-alpine
        command:
        - "/bin/sh"
        - "-c"
        args:
        - |
          apk add --no-cache make bash
          make unit

  - name: oai-operator-lint
    decorate: true
    run_if_changed: "^.*.go$"
    spec:
      containers:
      - image: golangci/golangci-lint:v2.8.0-alpine
        command:
        - "/bin/sh"
        - "-c"
        args:
        - |
          apk add --no-cache make bash
          make lint

  - name: oai-operator-gosec
    decorate: true
    run_if_changed: "^.*.go$"
    spec:
      containers:
      - image: golang:1.25-alpine
        command:
        - "/bin/sh"
        - "-c"
        args:
        - |
          apk add --no-cache make bash git
          make gosec

  - name: oai-operator-license-header-check
    decorate: true
    run_if_changed: "^.*.go$"
    spec:
      containers:
      - image: nephio/gotests:latest
        command:
        - "/bin/sh"
        args:
        - "-c"
        - |
          "/usr/local/bin/checklicense.sh"

  # always_run rather than run_if_changed: generated artifacts can go stale from
  # a .go change, a go.mod bump, a controller-gen version bump in the Makefile or
  # a hand edit under config/. A path filter that misses any of those would let
  # an unexpected or stale generated artifact merge with a green presubmit.
  - name: oai-operator-verify-codegen
    decorate: true
    always_run: true
    annotations:
      description: Regenerate the API artifacts in an isolated tree and verify the committed output and the CRD inventory.
    spec:
      containers:
      # The digest the Dockerfile builds with, so this commit verifies the same
      # way later. Tagged for what the digest actually contains: the Dockerfile
      # labels the same digest golang:1.25.6-alpine, which no longer matches.
      # diffutils is not in the image, so verify-codegen.sh sticks to diff
      # options BusyBox accepts.
      - image: golang:1.25.7-alpine3.23@sha256:f6751d823c26342f9506c03797d2527668d095b0a15f1862cddb4d927a7a4ced
        command:
        - "/bin/sh"
        - "-c"
        args:
        - |
          apk add --no-cache make bash git
          make verify

  - name: build-push-pre-image-oai
    cluster: default
    always_run: true
    branches:
    - "main"
    annotations:
      description: Build and Push Presubmit Image to Hub
    decorate: true
    decoration_config:
      censor_secrets: true
    max_concurrency: 0
    spec:
      containers:
      - name: kaniko
        image: gcr.io/kaniko-project/executor:debug
        command:
        - "/bin/sh"
        - "-c"
        - |
          executor --context=${PWD}/ \
            --dockerfile=Dockerfile --destination=nephio/oai-ran-controller:${BUILD_ID}
        volumeMounts:
          - name: kaniko-secret
            mountPath: /kaniko/.docker/
        resources:
          requests:
            cpu: 2
            memory: 2Gi
      volumes:
        - name: kaniko-secret
          secret:
            secretName: regcred
            items:
              - key: .dockerconfigjson
                path: config.json